#
# WorldGuard global configuration.
# All setting names use camelCase.
#

# Contains all WorldGuard settings.
settings:
  # Prefix available as {prefix} in messages.yml and logs.yml.
  prefix: "<dark_aqua><bold>WorldGuard</bold></dark_aqua><gray>:<white>"
  # Controls how actionbar messages with multiple lines are handled.
  messages:
    # Mode 1: when two or more lines are configured, sends nothing and writes an error to logs.yml.
    # Mode 2: when two or more lines are configured, randomly selects one on every delivery.
    # Mode 2 example: from "First", "Second", and "Third", the player sees only one random line.
    actionbarMultipleLinesMode: 2
  # Shows WorldGuard particle effects when available.
  useParticleEffects: true
  # Controls the particle border of a completed WorldEdit selection and the future claim.
  selectionParticles:
    # Shows the selection border to its player with particles.
    enable: true
    # Sets particle size. A larger value produces a thicker line; accepted range is 0.1 to 4.0.
    size: 2.5
    # Sets the desired distance between particles in blocks. A smaller value produces a denser line.
    spacing: 0.5
    # Limits the particles emitted per update for each player.
    maxCount: 512
    # Sets the maximum particle viewing distance in blocks.
    viewDistance: 128
    # Sets the update interval in ticks. 20 ticks equal one second; changes apply after a restart.
    updatePeriodTicks: 10
    # Clears the consumed selection this many seconds after a successful /rg claim, /rg define, or /rg redefine. -1 keeps it forever.
    clearAfterSuccessfulActionSeconds: 30
    # Maximum lifetime of any completed selection in seconds, even when it is never used. -1 disables the global limit.
    maximumLifetimeSeconds: 180
    # Sets the particle color as RGB components.
    color:
      # Red color component from 0 to 255.
      red: 253
      # Green color component from 0 to 255.
      green: 190
      # Blue color component from 0 to 255.
      blue: 0
  # Requires the command to be repeated within 30 seconds before adding an offline player to a region.
  confirmOfflinePlayerAdditions: true
  # Controls block physics and portal behavior.
  physics:
    # Prevents gravel from falling.
    noPhysicsGravel:
      enable: true
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 2
    # Prevents sand from falling.
    noPhysicsSand:
      enable: true
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 2
    # Allows portals to be created without region restrictions.
    allowPortalAnywhere:
      enable: false
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Lists blocks protected from water damage.
    disableWaterDamageBlocks:
      enable: false
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
      # Block list used by this mechanic.
      blocks: []

  # Controls TNT and lighter ignition.
  ignition:
    # Completely cancels TNT and TNT minecart explosions.
    blockTnt:
      enable: false
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Prevents TNT explosions from damaging blocks.
    blockTntBlockDamage:
      enable: true
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Prevents players from using fire-starting items.
    blockLighter:
      enable: false
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3

  # Controls fire and lava spreading.
  fire:
    # Prevents lava from creating fire.
    disableLavaFireSpread:
      enable: true
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 2
    # Prevents all fire from spreading.
    disableAllFireSpread:
      enable: false
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Lists blocks from which fire cannot spread.
    disableFireSpreadBlocks:
      enable: false
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
      # Block list used by this mechanic.
      blocks: []
    # Lists blocks over which lava may spread.
    lavaSpreadBlocks:
      enable: false
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
      # Block list used by this mechanic.
      blocks: []

  # Controls mob spawning, griefing, and explosions.
  mobs:
    # Cancels creeper explosions.
    blockCreeperExplosions:
      enable: false
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Prevents creeper explosions from damaging blocks.
    blockCreeperBlockDamage:
      enable: true
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Cancels wither spawn and death explosions.
    blockWitherExplosions:
      enable: false
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Prevents withers from damaging blocks.
    blockWitherBlockDamage:
      enable: true
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Cancels wither skull explosions.
    blockWitherSkullExplosions:
      enable: false
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Prevents wither skulls from damaging blocks.
    blockWitherSkullBlockDamage:
      enable: true
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Prevents ender dragons from damaging blocks.
    blockEnderdragonBlockDamage:
      enable: true
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Prevents ender dragons from creating exit portals.
    blockEnderdragonPortalCreation:
      enable: true
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Cancels fireball explosions.
    blockFireballExplosions:
      enable: false
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Prevents fireballs from damaging blocks.
    blockFireballBlockDamage:
      enable: true
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Cancels wind charge explosions.
    blockWindchargeExplosions:
      enable: false
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Prevents endermen from moving blocks.
    disableEndermanGriefing:
      enable: true
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Prevents snow golems from leaving snow trails.
    disableSnowmanTrails:
      enable: true
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 2
    # Prevents non-player causes from destroying paintings.
    blockPaintingDestroy:
      enable: true
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 2
    # Prevents non-player causes from destroying item frames.
    blockItemFrameDestroy:
      enable: true
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 2
    # Prevents non-player causes from destroying armor stands.
    blockArmorStandDestroy:
      enable: false
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Prevents slimes from spawning above ground.
    blockAboveGroundSlimes:
      enable: false
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Cancels explosions not covered by specific settings.
    blockOtherExplosions:
      enable: false
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
    # Prevents zombies from breaking doors.
    blockZombieDoorDestruction:
      enable: true
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 2
    # Prevents entities from entering protected vehicles.
    blockVehicleEntry:
      enable: false
      # Mode: 1 — only outside regions; 2 — only in foreign regions; 3 — everywhere.
      mode: 3
  # Controls region protection and storage.
  regions:
    # Shows the blocked-cmds-messages flag and its messages in /rg info. When false, the flag is hidden while command denial and its message still work.
    showBlockedCommandMessagesInRegionInfo: false
    # Shows a player's UUID when hovering over their name in /rg info.
    showPlayerUuidsInRegionInfo: false
    # Uses the separate hopper-minecart-access flag when opening hopper minecarts. An explicit deny blocks access even when true.
    allowHopperMinecartAccess: true
    # Uses creature spawn events for region spawn checks.
    useCreatureSpawnEvent: true
    # Disables region bypass mode when a player joins.
    disableBypassByDefault: false
    # Tells players when their region bypass mode is active.
    announceBypassStatus: false
    # Enables WorldGuard region protection.
    enable: true
    # Removes hostile mobs that attack invincible players.
    invincibilityRemovesMobs: false
    # Protects portal creation and destination selection.
    netherPortalProtection: true
    # Uses default fade timings for region title flags.
    titlesAlwaysUseDefaultTimes: true
    # Makes explosion flags protect entities as well as blocks.
    explosionFlagsBlockEntityDamage: false
    # Enables high-frequency checks for movement-related flags.
    highFrequencyFlags: false
    # Checks region flags when liquids cross region boundaries.
    protectAgainstLiquidFlow: false
    # Selects /rg list behavior: 1 keeps the legacy syntax, 2 requires my or global.
    listCommandMode: 2
    # Item used as the region selection wand.
    wand: "minecraft:leather"
    # Controls automatic cuboid expansion during /rg claim using the player's remaining volume allowance.
    claimExpansion:
      # Expands toward the world's minimum height while volume remains and no foreign region is reached.
      negativeY: true
      # Expands toward the world's maximum height while volume remains and no foreign region is reached.
      positiveY: true
      # Expands toward decreasing X while volume remains and no foreign region is reached.
      negativeX: false
      # Expands toward increasing X while volume remains and no foreign region is reached.
      positiveX: false
      # Expands toward decreasing Z while volume remains and no foreign region is reached.
      negativeZ: false
      # Expands toward increasing Z while volume remains and no foreign region is reached.
      positiveZ: false
    # Sets maximum claim volume by permission group. The highest value among a player's groups is used.
    maxClaimVolumePerPlayer:
      default: 1500000
      kroon: 1700000
      prince: 1900000
      phoenix: 2100000
      overlord: 2300000
      vlastelin: 2500000
      paladin: 2700000
      xozyain: 2900000
      dadmin: 3100000
      shulker: 3300000
      downer: 3500000
      tiktok: 3500000
      yt: 3500000
      helper: 3500000
      sthelper: 3700000
      moder: 3900000
      phantom: 3900000
      stmoder: 3900000
      glmoder: 3900000
      support: 4100000
      leto: 4300000
      mladmin: 4300000
      mediaowner: 4300000
      zamcurator: 4300000
      curator: 4300000
      glcurator: 4300000
      mladminkp: 4300000
      admin: 4300000
      stadmin: 4300000
      zamgladmin: 4300000
      gladmin: 4300000
      developer: 4600000
      tgk: 5000000
      techadmin: 5000000
    # Allows claims only inside regions the player owns.
    claimOnlyInsideExistingRegions: false
    # Prevents removing every region owner: at least one player or group must remain.
    preventLastOwnerRemoval: true
    # Applies location flags only inside explicit regions.
    locationFlagsOnlyInsideRegions: false
    # Sets region-count limits by permission group.
    maxRegionCountPerPlayer:
      # Default maximum number of regions a player may own.
      default: 1
      kroon: 2
      prince: 3
      phoenix: 4
      overlord: 5
