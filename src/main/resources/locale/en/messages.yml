#
# All player-facing WorldGuard messages pass through this file.
# mode: message sends lines to chat; actionbar uses one line; title uses title and optional subtitle lines.
# cooldownMillis suppresses repeated sends to the same player for this message; -1 disables cooldown.
# Empty message values send nothing. MiniMessage is required.
#
messages:
  permissionDenied:
    mode: message
    cooldownMillis: 1000
    message:
      - '{prefix} You do not have <#FDBE00>enough <white>permission'

  command:
    usage:
      mode: message
      cooldownMillis: -1
      message:
        - '{prefix} {usage}'
    unknown:
      mode: message
      cooldownMillis: -1
      message:
        - '{prefix} Command <#FDBE00>{command}<white> was not found'
    failed:
      mode: message
      cooldownMillis: 1000
      message:
        - '{prefix} An error occurred, <#FDBE00>check<white> the console'
    unknownFlag:
      mode: message
      cooldownMillis: -1
      message:
        - '{prefix} Unknown command <#FDBE00>flag<white>: <#FDBE00>{flag}'
    flagValueRequired:
      mode: message
      cooldownMillis: -1
      message:
        - '{prefix} Flag <#FDBE00>{flag}<white> requires a value'

  exception:
    numberExpectedValue:
      mode: message
      cooldownMillis: -1
      message:
        - '{prefix} A number was expected, but <#FDBE00>{value}<white> was given'
    numberExpected:
      mode: message
      cooldownMillis: -1
      message:
        - '{prefix} A number was expected'
    invalidComponent:
      mode: message
      cooldownMillis: -1
      message:
