#
# Все сообщения WorldGuard для игроков проходят через этот файл.
# mode: message отправляет строки в чат; actionbar использует одну строку; title — title и необязательный subtitle.
# cooldownMillis подавляет повторную отправку этого сообщения одному игроку; -1 отключает кулдаун.
# Пустое значение message ничего не отправляет. Используется MiniMessage.
#
messages:
  permissionDenied:
    mode: message
    cooldownMillis: 1000
    message:
      - '{prefix} У вас <#FDBE00>недостаточно <white>прав'

  command:
    usage:
      mode: message
      cooldownMillis: -1
      message:
        - '{prefix} {usage}'
    unknown:
      mode: message
      cooldownMillis: -1
      message:
        - '{prefix} Команда <#FDBE00>{command}<white> не найдена'
    failed:
      mode: message
      cooldownMillis: 1000
      message:
        - '{prefix} Произошла ошибка, <#FDBE00>посмотрите<white> консоль'
    unknownFlag:
      mode: message
      cooldownMillis: -1
      message:
        - '{prefix} Неизвестный <#FDBE00>флаг<white> команды <#FDBE00>{flag}'
    flagValueRequired:
      mode: message
      cooldownMillis: -1
      message:
        - '{prefix} Для флага <#FDBE00>{flag}<white> требуется значение'

  exception:
    numberExpectedValue:
      mode: message
      cooldownMillis: -1
      message:
        - '{prefix} Вместо <#FDBE00>{value}<white> укажите число'
    numberExpected:
      mode: message
      cooldownMillis: -1
      message:
        - '{prefix} Укажите число'
    invalidComponent:
      mode: message
      cooldownMillis: -1
      message:
