#
# Настройки новых и, при явном включении, уже существующих регионов.
# У существующих регионов заданные вручную флаги, приоритет и родитель не перезаписываются.
#

# Содержит все настройки регионов по умолчанию.
settings:
  # Включает применение настроек регионов из этого файла.
  enable: false
  # Содержит полные наборы правил, выбираемые по точному ID мира.
  worlds:
    # Общие правила для всех миров, для которых ниже нет отдельного точного ключа.
    "*":
      # Заполняет отсутствующие настройки регионов, существовавших до запуска плагина.
      applyToExistingRegions: false
      # Показывает /rg info для __global__, когда игрок не стоит ни в одном обычном регионе.
      showGlobalRegionInfo: false
      # Настройки, однократно применяемые к регионам из /rg define и /rg claim.
      newRegions:
        # Задаёт начальный приоритет региона.
        priority: 1
        # Назначает существующий родительский регион. Оставьте пустым, чтобы не назначать родителя.
        parent: ""
        # Добавляет перечисленных игроков и группы прав во владельцы.
        owners:
          # UUID игроков, добавляемых во владельцы.
          players: []
          # Группы прав, добавляемые во владельцы.
          groups: []
        # Добавляет перечисленных игроков и группы прав в участники.
        members:
          # UUID игроков, добавляемых в участники.
          players: []
          # Группы прав, добавляемые в участники.
          groups: []
        # Задаёт начальные флаги.
        flags:
          # Разрешает PvP в новых регионах.
          pvp: allow
          # Запрещает флаг неуязвимости в новых регионах.
          invincible: deny
          # Разрешает поршням перемещать блоки через границы регионов.
          pistons: allow
          # Разрешает удочке цеплять сущности внутри региона.
          fishing-hook: allow
          # Разрешает открывать загрузочные вагонетки даже игрокам, не состоящим в регионе.
          hopper-minecart-access: allow
          # Запрещает прочим взрывам разрушать блоки, не отключая урон сущностям.
          other-explosion: deny
        # Содержит категории команд с уникальными ID, запрещённые игрокам, которые не являются владельцами или участниками региона.
        blockedCommands:
          # Уникальная категория для команды установки личного дома.
          home:
            # Команды и подкоманды, запрещённые этой категорией.
            commands:
              - "/sethome"
            # Сообщение этой категории. Поддерживает строку или список строк; оставьте пустым, чтобы ничего не отправлять.
            message: "{prefix} Нельзя <#FDBE00>устанавливать<white> дом в <#FDBE00>чужом<white> регионе"
          # Уникальная категория для команды установки варпа.
          warp:
            # Команды и подкоманды, запрещённые этой категорией.
            commands:
              - "/setwarp"
            # Сообщение этой категории. Поддерживает строку или список строк; оставьте пустым, чтобы ничего не отправлять.
            message: "{prefix} Нельзя <#FDBE00>устанавливать<white> варп в <#FDBE00>чужом<white> регионе"
          # Уникальная категория для команды установки базы клана.
          clanBase:
            # Команды и подкоманды, запрещённые этой категорией.
            commands:
              - "/clan setbase"
            # Сообщение этой категории. Поддерживает строку или список строк; оставьте пустым, чтобы ничего не отправлять.
            message: "{prefix} Нельзя <#FDBE00>устанавливать<white> базу клана в <#FDBE00>чужом<white> регионе"
          # Уникальная категория для команды установки дома клана.
          clanHome:
            # Команды и подкоманды, запрещённые этой категорией.
            commands:
              - "/clan sethome"
            # Сообщение этой категории. Поддерживает строку или список строк; оставьте пустым, чтобы ничего не отправлять.
            message: "{prefix} Нельзя <#FDBE00>устанавливать<white> дом клана в <#FDBE00>чужом<white> регионе"

      # Настройки главного региона __global__ этого мира.
      globalRegion:
        # Задаёт приоритет глобального региона.
        priority: 0
        # Задаёт начальные флаги нового __global__ или заполняет отсутствующие у существующего.
        flags:
          # Разрешает PvP в глобальном регионе.
          pvp: allow
          # Запрещает флаг неуязвимости в глобальном регионе.
          invincible: deny
          # Разрешает поршням перемещать блоки через границы регионов.
          pistons: allow
          # Разрешает удочке цеплять сущности внутри региона.
          fishing-hook: allow
          # Разрешает открывать загрузочные вагонетки даже игрокам, не состоящим в регионе.
          hopper-minecart-access: allow
          # Запрещает прочим взрывам разрушать блоки, не отключая урон сущностям.
          other-explosion: deny
        # Удаляет перечисленные флаги глобального региона при запуске и /wg reload.
        clearFlags: []

    # Полные правила для мира с точным ID spawn. Этот ключ имеет приоритет над "*".
    spawn:
      # Заполняет отсутствующие безопасные настройки старых регионов и __global__, не перезаписывая ручные значения.
      applyToExistingRegions: true
      # Показывает /rg info для __global__, когда игрок не стоит ни в одном обычном регионе.
      showGlobalRegionInfo: true
      # Настройки, однократно применяемые к регионам из /rg define и /rg claim в мире spawn.
      newRegions:
        # Задаёт начальный приоритет региона.
        priority: 1
        # Назначает существующий родительский регион. Оставьте пустым, чтобы не назначать родителя.
        parent: ""
        # Добавляет перечисленных игроков и группы прав во владельцы.
        owners:
          # UUID игроков, добавляемых во владельцы.
          players: []
          # Группы прав, добавляемые во владельцы.
          groups: []
        # Добавляет перечисленных игроков и группы прав в участники.
        members:
          # UUID игроков, добавляемых в участники.
          players: []
          # Группы прав, добавляемые в участники.
          groups: []
        # Задаёт начальные флаги.
        flags:
          # Запрещает всем игрокам изменять блоки.
          build: deny
          # Запрещает ломать блоки.
          block-break: deny
          # Запрещает ставить блоки.
          block-place: deny
          # Защищает животных от урона игроков.
          damage-animals: deny
          # Запрещает PvP.
          pvp: deny
          # Запрещает взрывы якорей возрождения.
          respawn-anchors: deny
          # Запрещает использование TNT.
          tnt: deny
          # Разрешает доступ к контейнерам.
          chest-access: allow
          # Запрещает устанавливать транспорт.
          vehicle-place: deny
          # Запрещает разрушать транспорт.
          vehicle-destroy: deny
          # Запрещает использовать зажигалку.
          lighter: deny
          # Запрещает садиться на сущностей и транспорт.
          ride: deny
          # Запрещает эффекты взрывных зелий.
          potion-splash: deny
          # Запрещает вытаптывание блоков.
          block-trampling: deny
          # Запрещает урон от фейерверков.
          firework-damage: deny
          # Запрещает взрывы зарядов ветра.
          wind-charge-burst: deny
          # Запрещает выбрасывать предметы.
          item-drop: deny
          # Запрещает выпадение сфер опыта.
          exp-drops: deny
          # Запрещает мобам наносить урон игрокам.
          mob-damage: deny
          # Запрещает взрывы криперов.
          creeper-explosion: deny
          # Запрещает дракону Края разрушать блоки.
          enderdragon-block-damage: deny
          # Запрещает огненные шары гастов.
          ghast-fireball: deny
          # Запрещает прочие взрывы.
          other-explosion: deny
          # Запрещает взрывы зарядов бриза.
          breeze-charge-explosion: deny
          # Запрещает урон от визера.
          wither-damage: deny
          # Запрещает эндерменам переносить блоки.
          enderman-grief: deny
          # Запрещает разрушения от разорителей.
          ravager-grief: deny
          # Защищает картины от сущностей.
          entity-painting-destroy: deny
          # Защищает рамки от сущностей.
          entity-item-frame-destroy: deny
          # Запрещает появление мобов.
          mob-spawning: deny
          # Запрещает движение поршней.
          pistons: deny
          # Запрещает удочке цеплять сущности.
          fishing-hook: deny
          # Запрещает открывать загрузочные вагонетки.
          hopper-minecart-access: deny
          # Запрещает распространение огня.
          fire-spread: deny
          # Запрещает лаве создавать огонь.
          lava-fire: deny
          # Запрещает эффекты молнии.
          lightning: deny
          # Запрещает течение воды.
          water-flow: deny
          # Запрещает течение лавы.
          lava-flow: deny
          # Делает игроков неуязвимыми.
          invincible: allow
          # Явно запрещает урон от падения.
          fall-damage: deny
          # Запрещает потерю голода.
          natural-hunger-drain: deny
          # Запрещает телепортацию жемчугом Края.
          enderpearl: deny
          # Запрещает телепортацию плодом хоруса.
          chorus-fruit-teleport: deny
        # Содержит категории команд с уникальными ID, запрещённые игрокам, которые не являются владельцами или участниками региона.
        blockedCommands:
          # Уникальная категория для команды установки личного дома.
          home:
            # Команды и подкоманды, запрещённые этой категорией.
            commands:
              - "/sethome"
            # Сообщение этой категории. Поддерживает строку или список строк; оставьте пустым, чтобы ничего не отправлять.
            message: "{prefix} Нельзя <#FDBE00>устанавливать<white> дом в <#FDBE00>чужом<white> регионе"
          # Уникальная категория для команды установки варпа.
          warp:
            # Команды и подкоманды, запрещённые этой категорией.
            commands:
              - "/setwarp"
            # Сообщение этой категории. Поддерживает строку или список строк; оставьте пустым, чтобы ничего не отправлять.
            message: "{prefix} Нельзя <#FDBE00>устанавливать<white> варп в <#FDBE00>чужом<white> регионе"
          # Уникальная категория для команды установки базы клана.
          clanBase:
            # Команды и подкоманды, запрещённые этой категорией.
            commands:
              - "/clan setbase"
            # Сообщение этой категории. Поддерживает строку или список строк; оставьте пустым, чтобы ничего не отправлять.
            message: "{prefix} Нельзя <#FDBE00>устанавливать<white> базу клана в <#FDBE00>чужом<white> регионе"
          # Уникальная категория для команды установки дома клана.
          clanHome:
            # Команды и подкоманды, запрещённые этой категорией.
            commands:
              - "/clan sethome"
            # Сообщение этой категории. Поддерживает строку или список строк; оставьте пустым, чтобы ничего не отправлять.
            message: "{prefix} Нельзя <#FDBE00>устанавливать<white> дом клана в <#FDBE00>чужом<white> регионе"

      # Настройки главного региона __global__ мира spawn.
      globalRegion:
        # Задаёт приоритет глобального региона.
        priority: 0
        # Задаёт начальные флаги нового __global__ или заполняет отсутствующие у существующего.
        flags:
          # Запрещает всем игрокам изменять блоки.
          build: deny
          # Запрещает ломать блоки.
          block-break: deny
          # Запрещает ставить блоки.
          block-place: deny
          # Защищает животных от урона игроков.
          damage-animals: deny
          # Запрещает PvP.
          pvp: deny
          # Запрещает взрывы якорей возрождения.
          respawn-anchors: deny
          # Запрещает использование TNT.
          tnt: deny
          # Разрешает доступ к контейнерам.
          chest-access: allow
          # Запрещает устанавливать транспорт.
          vehicle-place: deny
          # Запрещает разрушать транспорт.
          vehicle-destroy: deny
          # Запрещает использовать зажигалку.
          lighter: deny
          # Запрещает садиться на сущностей и транспорт.
          ride: deny
          # Запрещает эффекты взрывных зелий.
          potion-splash: deny
          # Запрещает вытаптывание блоков.
          block-trampling: deny
          # Запрещает урон от фейерверков.
          firework-damage: deny
          # Запрещает взрывы зарядов ветра.
          wind-charge-burst: deny
          # Запрещает выбрасывать предметы.
          item-drop: deny
          # Запрещает выпадение сфер опыта.
          exp-drops: deny
          # Запрещает мобам наносить урон игрокам.
          mob-damage: deny
          # Запрещает взрывы криперов.
          creeper-explosion: deny
          # Запрещает дракону Края разрушать блоки.
          enderdragon-block-damage: deny
          # Запрещает огненные шары гастов.
          ghast-fireball: deny
          # Запрещает прочие взрывы.
          other-explosion: deny
          # Запрещает взрывы зарядов бриза.
          breeze-charge-explosion: deny
          # Запрещает урон от визера.
          wither-damage: deny
          # Запрещает эндерменам переносить блоки.
          enderman-grief: deny
          # Запрещает разрушения от разорителей.
          ravager-grief: deny
          # Защищает картины от сущностей.
          entity-painting-destroy: deny
          # Защищает рамки от сущностей.
          entity-item-frame-destroy: deny
          # Запрещает появление мобов.
          mob-spawning: deny
          # Запрещает движение поршней.
          pistons: deny
          # Запрещает удочке цеплять сущности.
          fishing-hook: deny
          # Запрещает открывать загрузочные вагонетки.
          hopper-minecart-access: deny
          # Запрещает распространение огня.
          fire-spread: deny
          # Запрещает лаве создавать огонь.
          lava-fire: deny
          # Запрещает эффекты молнии.
          lightning: deny
          # Запрещает течение воды.
          water-flow: deny
          # Запрещает течение лавы.
          lava-flow: deny
          # Делает игроков неуязвимыми.
          invincible: allow
          # Явно запрещает урон от падения.
          fall-damage: deny
          # Запрещает потерю голода.
          natural-hunger-drain: deny
          # Запрещает телепортацию жемчугом Края.
          enderpearl: deny
          # Запрещает телепортацию плодом хоруса.
          chorus-fruit-teleport: deny
        # Удаляет перечисленные флаги глобального региона при запуске и /wg reload.
        clearFlags: []

    # Мир arena наследует общие правила "*", изменяя только показ __global__ в /rg info.
    arena:
      # Показывает /rg info для __global__, когда игрок не стоит ни в одном обычном регионе.
      showGlobalRegionInfo: true
