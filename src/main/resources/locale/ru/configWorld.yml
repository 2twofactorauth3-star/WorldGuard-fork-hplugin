#
# Конфигурация WorldGuard для отдельного мира (configWorld.yml).
# Все названия настроек используют camelCase.
#

# Содержит все настройки WorldGuard.
settings:
  # Управляет чёрным списком блоков и предметов этого мира из blacklist.txt.
  blacklist:
    # Переключает список в режим белого списка: разрешены только явно указанные действия.
    useAsWhitelist: false
    # Настраивает направления для действия log.
    logging:
      # Настраивает журналирование blacklist в консоль сервера.
      console:
        # Включает журналирование blacklist в консоль сервера.
        enable: true
      # Настраивает журналирование blacklist в файлы.
      file:
        # Включает журналирование blacklist в файлы.
        enable: false
        # Задаёт путь и шаблон даты файла журнала blacklist.
        path: "plugins/WorldGuard/logs/%Y-%m-%d.log"
        # Ограничивает количество одновременно открытых файлов журнала blacklist.
        openFiles: 10
  # Управляет физикой блоков и поведением порталов.
  physics:
    # Запрещает падение гравия.
    noPhysicsGravel:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает падение песка.
    noPhysicsSand:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Разрешает создавать порталы без ограничений регионов.
    allowPortalAnywhere:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает движение поршней. При enable: false поршни разрешены везде, кроме регионов с явным pistons: deny.
    blockPistons:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только при пересечении границы чужого региона; 3 — везде.
      mode: 3
    # Список блоков, защищённых от повреждения водой.
    disableWaterDamageBlocks:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
      # Список блоков для этой механики.
      blocks: []

  # Управляет поджиганием TNT и использованием зажигалки.
  ignition:
    # Полностью отменяет взрывы TNT и вагонеток с TNT.
    blockTnt:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает взрывам TNT повреждать блоки.
    blockTntBlockDamage:
      enable: true
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает игрокам использовать предметы для поджигания.
    blockLighter:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3

  # Управляет распространением огня и лавы.
  fire:
    # Запрещает лаве создавать огонь.
    disableLavaFireSpread:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Полностью запрещает распространение огня.
    disableAllFireSpread:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Список блоков, от которых огонь не может распространяться.
    disableFireSpreadBlocks:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
      # Список блоков для этой механики.
      blocks: []
    # Список блоков, по которым разрешено растекаться лаве.
    lavaSpreadBlocks:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
      # Список блоков для этой механики.
      blocks: []

  # Управляет появлением мобов, гриферством и взрывами.
  mobs:
    # Отменяет взрывы криперов.
    blockCreeperExplosions:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает взрывам криперов повреждать блоки.
    blockCreeperBlockDamage:
      enable: true
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Отменяет взрывы при появлении и смерти визера.
    blockWitherExplosions:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает визерам повреждать блоки.
    blockWitherBlockDamage:
      enable: true
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Отменяет взрывы черепов визера.
    blockWitherSkullExplosions:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает черепам визера повреждать блоки.
    blockWitherSkullBlockDamage:
      enable: true
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает драконам Края повреждать блоки.
    blockEnderdragonBlockDamage:
      enable: true
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает драконам Края создавать выходные порталы.
    blockEnderdragonPortalCreation:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Отменяет взрывы огненных шаров.
    blockFireballExplosions:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает огненным шарам повреждать блоки.
    blockFireballBlockDamage:
      enable: true
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Отменяет взрывы зарядов ветра.
    blockWindchargeExplosions:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает эндерменам переносить блоки.
    disableEndermanGriefing:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает снежным големам оставлять снежные следы.
    disableSnowmanTrails:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает неигровым причинам разрушать картины.
    blockPaintingDestroy:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает неигровым причинам разрушать рамки.
    blockItemFrameDestroy:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает неигровым причинам разрушать стойки для брони.
    blockArmorStandDestroy:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает слизням появляться над землёй.
    blockAboveGroundSlimes:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Отменяет взрывы, не охваченные отдельными настройками.
    blockOtherExplosions:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает зомби ломать двери.
    blockZombieDoorDestruction:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Запрещает сущностям садиться в защищённый транспорт.
    blockVehicleEntry:
      enable: false
      # Режим: 1 — только вне регионов; 2 — только в чужих регионах; 3 — везде.
      mode: 3
    # Применяет ограничения WorldGuard на спавн к мобам, созданным плагинами или командами.
    blockPluginSpawning: true
  # Управляет защитой и хранением регионов.
  regions:
    # Показывает UUID игрока при наведении на его имя в /rg info.
    showPlayerUuidsInRegionInfo: false
    # Настраивает дополнительную информацию о размере региона в /rg info.
    regionInfo:
      # Показывает количество блоков физического региона в /rg info.
      showBlockCount: true
      # Настраивает группировку разрядов в количестве блоков.
      numberGrouping:
        # Включает форматирование: например, 1434482 превращается в 1.434.482.
        enable: true
        # Разделитель групп разрядов.
        separator: "."
    # Использует отдельный флаг hopper-minecart-access для открытия загрузочных вагонеток. Явный deny запрещает доступ даже при true.
    allowHopperMinecartAccess: true
    # Включает защиту регионов WorldGuard.
    enable: true
    # Удаляет враждебных мобов, атакующих неуязвимых игроков.
    invincibilityRemovesMobs: false
    # Защищает создание порталов и выбор точки назначения.
    netherPortalProtection: true
    # Использует стандартные времена появления заголовков регионов.
    titlesAlwaysUseDefaultTimes: true
    # Распространяет защиту флагов взрывов на сущности и блоки.
    explosionFlagsBlockEntityDamage: false
    # Включает частые проверки флагов, связанных с перемещением.
    highFrequencyFlags: false
    # Учитывает только исходные регионы с максимальным приоритетом для сущностей и блоков.
    useMaxPriorityAssociation: false
    # Проверяет флаги, когда жидкость пересекает границу региона.
    protectAgainstLiquidFlow: false
    # Режим команды /rg list: 1 — старый режим, 2 — обязательный выбор my или global.
    listCommandMode: 2
    # Предмет, используемый как инструмент выделения региона.
    wand: "minecraft:leather"
    # Управляет автоматическим расширением кубоидного региона при /rg claim за счёт оставшегося лимита объёма.
    claimExpansion:
      # Когда предлагать убрать авторасширение: 1 — никогда, 2 — после выделения, 3 — после создания региона, 4 — в обоих случаях.
      offerRemovalMode: 4
      # Расширение вниз к минимальной высоте мира.
      negativeY:
        # Включает это направление.
        enable: true
        # Максимальное расширение в блоках; -1 означает до границы мира.
        maxDistance: -1
      # Расширение вверх к максимальной высоте мира.
      positiveY:
        # Включает это направление.
        enable: true
        # Максимальное расширение в блоках; -1 означает до границы мира.
        maxDistance: -1
      # Расширение в сторону уменьшения X.
      negativeX:
        # Включает это направление.
        enable: false
        # Максимальное расширение в блоках; -1 означает до границы мира.
        maxDistance: -1
      # Расширение в сторону увеличения X.
      positiveX:
        # Включает это направление.
        enable: false
        # Максимальное расширение в блоках; -1 означает до границы мира.
        maxDistance: -1
      # Расширение в сторону уменьшения Z.
      negativeZ:
        # Включает это направление.
        enable: false
        # Максимальное расширение в блоках; -1 означает до границы мира.
        maxDistance: -1
      # Расширение в сторону увеличения Z.
      positiveZ:
        # Включает это направление.
        enable: false
        # Максимальное расширение в блоках; -1 означает до границы мира.
        maxDistance: -1
    # Задаёт максимальный объём привата по группам прав. Используется наибольшее значение среди групп игрока.
    maxClaimVolumePerPlayer:
      default: 1500000
      kroon: 1700000
      prince: 1900000
      phoenix: 2100000
      overlord: 2300000
      vlastelin: 2500000
      paladin: 2700000
      xozyain: 2900000
      dadmin: 3100000
      shulker: 3300000
      downer: 3500000
      tiktok: 3500000
      yt: 3500000
      helper: 3500000
      sthelper: 3700000
      moder: 3900000
      phantom: 3900000
      stmoder: 3900000
      glmoder: 3900000
      support: 4100000
      leto: 4300000
      mladmin: 4300000
      mediaowner: 4300000
      zamcurator: 4300000
      curator: 4300000
      glcurator: 4300000
      mladminkp: 4300000
      admin: 4300000
      stadmin: 4300000
      zamgladmin: 4300000
      gladmin: 4300000
      developer: 4600000
      tgk: 5000000
      techadmin: 5000000
    # Разрешает приваты только внутри регионов игрока.
    claimOnlyInsideExistingRegions: false
    # Запрещает удалять всех владельцев региона: должен остаться хотя бы один игрок или группа.
    preventLastOwnerRemoval: true
    # Применяет позиционные флаги только внутри явных регионов.
    locationFlagsOnlyInsideRegions: false
    # Задаёт лимиты количества регионов по группам прав.
    maxRegionCountPerPlayer:
      # Стандартный максимум регионов во владении игрока.
      default: 1
      kroon: 2
      prince: 3
      phoenix: 4
      overlord: 5
      vlastelin: 6
      paladin: 7
      xozyain: 8
      dadmin: 9
      shulker: 10
      downer: 11
      tiktok: 11
      yt: 11
      helper: 11
      sthelper: 12
      moder: 13
      phantom: 13
      stmoder: 13
      glmoder: 13
      support: 14
      leto: 15
      mladmin: 15
      mediaowner: 15
      zamcurator: 15
      curator: 15
      glcurator: 15
      mladminkp: 15
      admin: 15
      stadmin: 15
      zamgladmin: 15
      gladmin: 15
      developer: 20
      tgk: 999
      techadmin: 999
